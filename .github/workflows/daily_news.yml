name: Daily Ireland News to Discord

on:
  schedule:
    # UTC基準で指定します（日本時間 = UTC + 9時間）
    # 例: '0 23 * * *' は 毎日 23:00 UTC = 翌朝 08:00 JST
    # ※アイルランド時間（冬時間 UTC+0 / 夏時間 UTC+1）に合わせる場合もUTCで指定してください
    - cron: '0 23 * * *'

  # GitHubの「Actions」タブから手動でテスト実行できるようにする設定
  workflow_dispatch:

jobs:
  post-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, translate, and post Ireland news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEADLINES_PER_SOURCE: "5"
        run: python main.py
